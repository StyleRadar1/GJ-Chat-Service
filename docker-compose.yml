# Ambiente local de GJ-Chat-Service: PostgreSQL propio (Database per Service) y el servicio.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chat_db}
      POSTGRES_USER: ${DB_USERNAME:-chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chat}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - chat-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chat} -d ${DB_NAME:-chat_db}"]
      interval: 5s
      retries: 10

  gj-chat-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chat_db}
      DB_USERNAME: ${DB_USERNAME:-chat}
      DB_PASSWORD: ${DB_PASSWORD:-chat}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      SEGUNDA_MANO_URL: ${SEGUNDA_MANO_URL:-http://host.docker.internal:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8089}:8089"

volumes:
  chat-data:
