# Ambiente local de GJ-Chat-Service: PostgreSQL y RabbitMQ propios; Redis se habilita en el perfil realtime.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chat_db}
      POSTGRES_USER: ${DB_USERNAME:-chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chat}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - chat-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chat} -d ${DB_NAME:-chat_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    profiles: ["realtime"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gj-chat-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chat_db}
      DB_USERNAME: ${DB_USERNAME:-chat}
      DB_PASSWORD: ${DB_PASSWORD:-chat}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      WEBSOCKET_REDIS_ENABLED: ${WEBSOCKET_REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      SEGUNDA_MANO_URL: ${SEGUNDA_MANO_URL:-http://host.docker.internal:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8320}:8320"

volumes:
  chat-data:
