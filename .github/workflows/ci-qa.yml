name: CI QA

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  IMAGE_NAME: gj-chat-service

jobs:
  build-test:
    name: Build, pruebas, análisis estático y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compila, corre unitarias + integración (Testcontainers) y exige 85 % de cobertura en dominio y aplicación
      - name: Build, pruebas y cobertura (JaCoCo ≥ 85 %)
        run: mvn -B clean verify

      - name: Análisis estático (Checkstyle · Google Java Style)
        run: mvn -B checkstyle:checkstyle

      - name: Publicar reportes (JaCoCo, pruebas y Checkstyle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/checkstyle-result.xml

  docker-image:
    name: Imagen Docker
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen (multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verificar la imagen construida
        run: docker image inspect ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} --format 'Imagen {{.RepoTags}} · {{.Size}} bytes'

  build-push:
    name: Publicar imagen QA en Docker Hub
    needs: docker-image
    # Requiere DEPLOY_ENABLED=true. CORS es opcional mientras no exista frontend QA.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/feature/websocket-realtime-qa' ||
       github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Despliegue en Azure QA
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: ${{ steps.deploy.outputs.webapp-url }}/swagger-ui.html
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar variables de entorno del App Service
        uses: azure/cli@v2
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DB_URL: ${{ secrets.DB_URL_QA }}
          DB_USERNAME: ${{ secrets.DB_USERNAME_QA }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_QA }}
          JWT_SECRET_BASE64: ${{ secrets.JWT_SECRET_QA }}
          SEGUNDA_MANO_URL: ${{ secrets.SEGUNDA_MANO_URL_QA }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST_QA || 'styleradar-rabbitmq-qa.northcentralus.cloudapp.azure.com' }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT_QA || '5671' }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST_QA || '/' }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER_QA }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD_QA }}
          RABBITMQ_TRUSTSTORE_BASE64: ${{ secrets.RABBITMQ_TRUSTSTORE_BASE64_QA }}
          RABBITMQ_TRUSTSTORE_PASSWORD: ${{ secrets.RABBITMQ_TRUSTSTORE_PASSWORD_QA || 'changeit' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS_QA }}
        with:
          inlineScript: |
            test -n "$WEBAPP_NAME" && test -n "$DB_URL" && test -n "$DB_USERNAME" \
              && test -n "$DB_PASSWORD" && test -n "$JWT_SECRET_BASE64" \
              && test -n "$RABBITMQ_USER" && test -n "$RABBITMQ_PASSWORD" \
              && test -n "$RABBITMQ_TRUSTSTORE_BASE64" \
              || { echo "Faltan secrets requeridos para el despliegue QA"; exit 1; }
            RG=$(az webapp list --query "[?name=='$WEBAPP_NAME'].resourceGroup | [0]" -o tsv)
            test -n "$RG" || { echo "No existe el App Service QA $WEBAPP_NAME"; exit 1; }
            az webapp config appsettings set \
              --name "$WEBAPP_NAME" \
              --resource-group "$RG" \
              --output none \
              --settings \
                SPRING_PROFILES_ACTIVE=qa \
                WEBSITES_PORT=8320 \
                DB_URL="$DB_URL" \
                DB_USERNAME="$DB_USERNAME" \
                DB_PASSWORD="$DB_PASSWORD" \
                JWT_SECRET_BASE64="$JWT_SECRET_BASE64" \
                SEGUNDA_MANO_URL="$SEGUNDA_MANO_URL" \
                RABBITMQ_HOST="$RABBITMQ_HOST" \
                RABBITMQ_PORT="$RABBITMQ_PORT" \
                RABBITMQ_VHOST="$RABBITMQ_VHOST" \
                RABBITMQ_USER="$RABBITMQ_USER" \
                RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
                RABBITMQ_SSL_ENABLED=true \
                RABBITMQ_TRUSTSTORE_BASE64="$RABBITMQ_TRUSTSTORE_BASE64" \
                RABBITMQ_TRUSTSTORE_PASSWORD="$RABBITMQ_TRUSTSTORE_PASSWORD" \
                CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-}" \
                WEBSOCKET_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-}" \
                DOCKER_REGISTRY_SERVER_URL=https://index.docker.io/v1/ \
                DOCKER_REGISTRY_SERVER_USERNAME="$DOCKERHUB_USERNAME" \
                DOCKER_REGISTRY_SERVER_PASSWORD="$DOCKERHUB_TOKEN" \
                WEBSITES_ENABLE_APP_SERVICE_STORAGE=false
            az webapp config set --name "$WEBAPP_NAME" --resource-group "$RG" \
              --web-sockets-enabled true --output none

      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}

      - name: Smoke test
        run: |
          URL="https://${{ secrets.AZURE_WEBAPP_NAME_QA }}.azurewebsites.net/actuator/health"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Intento $i: $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "GJ-Chat-Service no respondió en $URL"
          exit 1
