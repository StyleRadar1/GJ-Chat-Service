name: CI PROD

on:
  push:
    tags: ['v*.*.*']

env:
  IMAGE_NAME: gj-chat-service

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify

  build-push:
    name: Imagen de versión en Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy-prod:
    name: Despliegue en Azure PROD (con aprobación manual)
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}/swagger-ui.html
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Configurar variables de entorno del App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            RG=$(az webapp list --query "[?name=='${{ secrets.AZURE_WEBAPP_NAME_PROD }}'].resourceGroup | [0]" -o tsv)
            az webapp config appsettings set \
              --name "${{ secrets.AZURE_WEBAPP_NAME_PROD }}" \
              --resource-group "$RG" \
              --output none \
              --settings \
                WEBSITES_PORT=8320 \
                DB_URL="${{ secrets.DB_URL_PROD }}" \
                DB_USERNAME="${{ secrets.DB_USERNAME_PROD }}" \
                DB_PASSWORD="${{ secrets.DB_PASSWORD_PROD }}" \
                JWT_SECRET_BASE64="${{ secrets.JWT_SECRET_PROD }}" \
                SEGUNDA_MANO_URL="${{ secrets.SEGUNDA_MANO_URL_PROD }}"
      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
