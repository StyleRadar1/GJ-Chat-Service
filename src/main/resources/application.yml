server:
  port: ${SERVER_PORT:8089}
  shutdown: graceful

spring:
  application:
    name: gj-chat-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DB_USERNAME:chat}
    password: ${DB_PASSWORD:chat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          segunda-mano:
            connect-timeout: ${SEGUNDA_MANO_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${SEGUNDA_MANO_READ_TIMEOUT_MS:5000}

styleradar:
  security:
    jwt:
      # Debe ser la misma llave con la que el servicio de identidad firma los tokens.
      secret-base64: ${JWT_SECRET_BASE64:}
      # El token del monolito no trae roles; mientras tanto se asume este rol.
      rol-por-defecto: ${JWT_ROL_POR_DEFECTO:COMPRADOR}
  servicios:
    segunda-mano:
      # Sprint 1: monolito. Luego: ms-segunda-vida-donaciones.
      url: ${SEGUNDA_MANO_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
