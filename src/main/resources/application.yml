server:
  port: ${SERVER_PORT:8320}
  shutdown: graceful

spring:
  application:
    name: gj-chat-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DB_USERNAME:chat}
    password: ${DB_PASSWORD:chat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000ms
          multiplier: 2.0
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  cloud:
    openfeign:
      client:
        config:
          second-hand:
            connect-timeout: ${SEGUNDA_MANO_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${SEGUNDA_MANO_READ_TIMEOUT_MS:5000}

styleradar:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      # Legacy fallback for tokens that carry neither `role` nor `roles`.
      default-role: ${JWT_ROL_POR_DEFECTO:COMPRADOR}
  services:
    second-hand:
      url: ${SEGUNDA_MANO_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:}}
    redis:
      enabled: ${WEBSOCKET_REDIS_ENABLED:false}
      channel: ${WEBSOCKET_REDIS_CHANNEL:styleradar.chat.realtime}

management:
  health:
    redis:
      enabled: ${WEBSOCKET_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
